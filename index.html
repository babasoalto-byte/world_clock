<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hora Mundial</title>

<!-- DM Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'DM Sans', sans-serif;
    background: transparent;
    padding: 8px;
}

.widget {
    background: #ffffff;
    border-radius: 10px;
    padding: 14px 16px;
    max-width: 360px;
    width: 100%;
}

.title {
    font-size: 0px;
    font-weight: 600;
    margin-bottom: 2px;
    color: #222222;
}

.date {
    font-size: 10px;
    font-weight: 400;
    color: #777777;
    margin-bottom: 10px;
}

.city-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid #eeeeee;
}

.city-row:last-child {
    border-bottom: none;
}

.city {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #333333;
    font-size: 11px;
    font-weight: 500;
}

.time {
    font-size: 11px;
    font-weight: 600;
    color: #111111;
    min-width: 45px;
    text-align: right;
}

.flag {
    font-size: 13px;
}

</style>
</head>

<body>

<div class="widget">

    <div class="title">
        HORA MUNDIAL
    </div>

    <div class="date" id="date"></div>

    <div class="city-row">
        <div class="city">
            <span class="flag">🇨🇱</span>
            Santiago
        </div>

        <div class="time" id="santiago"></div>
    </div>

    <div class="city-row">
        <div class="city">
            <span class="flag">🇦🇷</span>
            Buenos Aires
        </div>

        <div class="time" id="buenosaires"></div>
    </div>

    <div class="city-row">
        <div class="city">
            <span class="flag">🇲🇽</span>
            Ciudad de México
        </div>

        <div class="time" id="mexico"></div>
    </div>

    <div class="city-row">
        <div class="city">
            <span class="flag">🇺🇸</span>
            Los Ángeles
        </div>

        <div class="time" id="losangeles"></div>
    </div>

    <div class="city-row">
        <div class="city">
            <span class="flag">🇪🇸</span>
            Madrid
        </div>

        <div class="time" id="madrid"></div>
    </div>

</div>

<script>

const cities = {

    santiago: {
        timezone: 'America/Santiago',
        locale: 'es-CL'
    },

    buenosaires: {
        timezone: 'America/Argentina/Buenos_Aires',
        locale: 'es-AR'
    },

    mexico: {
        timezone: 'America/Mexico_City',
        locale: 'es-MX'
    },

    losangeles: {
        timezone: 'America/Los_Angeles',
        locale: 'es-US'
    },

    madrid: {
        timezone: 'Europe/Madrid',
        locale: 'es-ES'
    }

};


function updateClocks() {

    const now = new Date();

    const timeOptions = {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    };


    /* Santiago */

    document.getElementById('santiago').textContent =
        now.toLocaleTimeString(
            cities.santiago.locale,
            {
                ...timeOptions,
                timeZone: cities.santiago.timezone
            }
        );


    /* Buenos Aires */

    document.getElementById('buenosaires').textContent =
        now.toLocaleTimeString(
            cities.buenosaires.locale,
            {
                ...timeOptions,
                timeZone: cities.buenosaires.timezone
            }
        );


    /* Ciudad de México */

    document.getElementById('mexico').textContent =
        now.toLocaleTimeString(
            cities.mexico.locale,
            {
                ...timeOptions,
                timeZone: cities.mexico.timezone
            }
        );


    /* Los Ángeles */

    document.getElementById('losangeles').textContent =
        now.toLocaleTimeString(
            cities.losangeles.locale,
            {
                ...timeOptions,
                timeZone: cities.losangeles.timezone
            }
        );


    /* Madrid */

    document.getElementById('madrid').textContent =
        now.toLocaleTimeString(
            cities.madrid.locale,
            {
                ...timeOptions,
                timeZone: cities.madrid.timezone
            }
        );


    /* Fecha */

    document.getElementById('date').textContent =
        now.toLocaleDateString(
            'es-CL',
            {
                weekday: 'long',
                day: 'numeric',
                month: 'long'
            }
        );

}


updateClocks();

setInterval(updateClocks, 1000);

</script>

</body>
</html>
