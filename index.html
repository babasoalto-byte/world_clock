<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title></title>

  <!-- DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f7f7f7;
      color: #000000;
      font-family: "DM Sans", sans-serif;
      font-size: 13px;
    }

    .clock-container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .city {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .city:last-child {
      border-bottom: none;
    }

    .city-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 400;
    }

    .flag {
      font-size: 15px;
      line-height: 1;
    }

    .time-container {
      text-align: right;
      min-width: 75px;
    }

    .time {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
    }

    .date {
      margin-top: 2px;
      font-size: 10px;
      line-height: 1.2;
      opacity: 0.55;
      text-transform: lowercase;
    }
  </style>
</head>

<body>

  <div class="clock-container">

    <div class="city">
      <div class="city-name">
        <span class="flag">🇨🇱</span>
        <span>Santiago</span>
      </div>

      <div class="time-container">
        <div class="time" id="santiago-time">--:--</div>
        <div class="date" id="santiago-date">---</div>
      </div>
    </div>


    <div class="city">
      <div class="city-name">
        <span class="flag">🇲🇽</span>
        <span>Ciudad de México</span>
      </div>

      <div class="time-container">
        <div class="time" id="mexico-time">--:--</div>
        <div class="date" id="mexico-date">---</div>
      </div>
    </div>


    <div class="city">
      <div class="city-name">
        <span class="flag">🇺🇸</span>
        <span>Los Ángeles</span>
      </div>

      <div class="time-container">
        <div class="time" id="losangeles-time">--:--</div>
        <div class="date" id="losangeles-date">---</div>
      </div>
    </div>


    <div class="city">
      <div class="city-name">
        <span class="flag">🇪🇸</span>
        <span>Madrid</span>
      </div>

      <div class="time-container">
        <div class="time" id="madrid-time">--:--</div>
        <div class="date" id="madrid-date">---</div>
      </div>
    </div>


    <div class="city">
      <div class="city-name">
        <span class="flag">🇦🇷</span>
        <span>Buenos Aires</span>
      </div>

      <div class="time-container">
        <div class="time" id="buenosaires-time">--:--</div>
        <div class="date" id="buenosaires-date">---</div>
      </div>
    </div>

  </div>


  <script>

    const cities = [
      {
        id: "santiago",
        timezone: "America/Santiago"
      },
      {
        id: "mexico",
        timezone: "America/Mexico_City"
      },
      {
        id: "losangeles",
        timezone: "America/Los_Angeles"
      },
      {
        id: "madrid",
        timezone: "Europe/Madrid"
      },
      {
        id: "buenosaires",
        timezone: "America/Argentina/Buenos_Aires"
      }
    ];


    function updateClocks() {

      const now = new Date();

      cities.forEach(city => {

        const timeFormatter = new Intl.DateTimeFormat("es-CL", {
          timeZone: city.timezone,
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });

        const dateFormatter = new Intl.DateTimeFormat("es-CL", {
          timeZone: city.timezone,
          weekday: "short",
          day: "2-digit",
          month: "short"
        });

        const time = timeFormatter.format(now);
        const date = dateFormatter.format(now);

        document.getElementById(`${city.id}-time`).textContent = time;

        document.getElementById(`${city.id}-date`).textContent =
          date.replace(/\./g, "");

      });

    }


    updateClocks();

    setInterval(updateClocks, 1000);

  </script>

</body>
</html>
