<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hora Mundial</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'DM Sans', sans-serif;
    background: transparent;
    padding: 8px;
}

.widget {
    background: #ffffff;
    border-radius: 12px;
    padding: 16px;
    max-width: 360px;
}

.header {
    margin-bottom: 10px;
}

.date {
    font-size: 11px;
    font-weight: 400;
    color: #888888;
}

.city-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid #eeeeee;
}

.city-row:last-child {
    border-bottom: none;
}

.city {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #333333;
    font-size: 12px;
    font-weight: 400;
}

.flag {
    font-size: 14px;
}

.time {
    font-size: 12px;
    font-weight: 600;
    color: #111111;
    min-width: 45px;
    text-align: right;
}

</style>
</head>

<body>

<div class="widget">

    <div class="header">
        <div class="date" id="date"></div>
    </div>

    <div class="city-row">
        <div class="city">
            <span class="flag">🇨🇱</span>
            Santiago
        </div>
        <div class="time" id="santiago"></div>
    </div>

    <div class="city-row">
        <div class="city">
            <span class="flag">🇦🇷</span>
            Buenos Aires
        </div>
        <div class="time" id="buenosaires"></div>
    </div>

    <div class="city-row">
        <div class="city">
            <span class="flag">🇲🇽</span>
            Ciudad de México
        </div>
        <div class="time" id="mexico"></div>
    </div>

    <div class="city-row">
        <div class="city">
            <span class="flag">🇺🇸</span>
            Los Ángeles
        </div>
        <div class="time" id="losangeles"></div>
    </div>

    <div class="city-row">
        <div class="city">
            <span class="flag">🇪🇸</span>
            Madrid
        </div>
        <div class="time" id="madrid"></div>
    </div>

</div>

<script>

function updateClocks() {

    const now = new Date();

    const timeOptions = {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    };

    document.getElementById('santiago').textContent =
        now.toLocaleTimeString('es-CL', {
            ...timeOptions,
            timeZone: 'America/Santiago'
        });

    document.getElementById('buenosaires').textContent =
        now.toLocaleTimeString('es-AR', {
            ...timeOptions,
            timeZone: 'America/Argentina/Buenos_Aires'
        });

    document.getElementById('mexico').textContent =
        now.toLocaleTimeString('es-MX', {
            ...timeOptions,
            timeZone: 'America/Mexico_City'
        });

    document.getElementById('losangeles').textContent =
        now.toLocaleTimeString('es-MX', {
            ...timeOptions,
            timeZone: 'America/Los_Angeles'
        });

    document.getElementById('madrid').textContent =
        now.toLocaleTimeString('es-ES', {
            ...timeOptions,
            timeZone: 'Europe/Madrid'
        });

    const dateOptions = {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        timeZone: 'America/Santiago'
    };

    let date = now.toLocaleDateString('es-CL', dateOptions);

    date = date.charAt(0).toUpperCase() + date.slice(1);

    document.getElementById('date').textContent = date;
}

updateClocks();

setInterval(updateClocks, 1000);

</script>

</body>
</html>
