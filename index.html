<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title></title>

  <!-- DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      color: #000000;
      font-family: "DM Sans", sans-serif;
      font-size: 13px;
      font-weight: 400;
    }

    .world-clock {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .city {
      flex: 1;
      min-width: 0;
    }

    .city-name {
      margin-bottom: 7px;
      font-size: 13px;
      line-height: 1.2;
    }

    .time {
      font-size: 13px;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: 0;
    }

    .date {
      margin-top: 4px;
      font-size: 10px;
      line-height: 1.2;
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      .world-clock {
        flex-direction: column;
        gap: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="world-clock">

    <div class="city">
      <div class="city-name">Santiago</div>
      <div class="time" id="santiago-time">--:--</div>
      <div class="date" id="santiago-date">--</div>
    </div>

    <div class="city">
      <div class="city-name">Ciudad de México</div>
      <div class="time" id="mexico-time">--:--</div>
      <div class="date" id="mexico-date">--</div>
    </div>

    <div class="city">
      <div class="city-name">Los Ángeles</div>
      <div class="time" id="losangeles-time">--:--</div>
      <div class="date" id="losangeles-date">--</div>
    </div>

    <div class="city">
      <div class="city-name">Madrid</div>
      <div class="time" id="madrid-time">--:--</div>
      <div class="date" id="madrid-date">--</div>
    </div>

    <div class="city">
      <div class="city-name">Buenos Aires</div>
      <div class="time" id="buenosaires-time">--:--</div>
      <div class="date" id="buenosaires-date">--</div>
    </div>

  </div>


  <script>

    const cities = [
      {
        id: "santiago",
        timezone: "America/Santiago"
      },
      {
        id: "mexico",
        timezone: "America/Mexico_City"
      },
      {
        id: "losangeles",
        timezone: "America/Los_Angeles"
      },
      {
        id: "madrid",
        timezone: "Europe/Madrid"
      },
      {
        id: "buenosaires",
        timezone: "America/Argentina/Buenos_Aires"
      }
    ];


    function updateClocks() {

      cities.forEach(city => {

        const now = new Date();

        // Hora
        const time = new Intl.DateTimeFormat("es-CL", {
          timeZone: city.timezone,
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(now);

        // Fecha
        const date = new Intl.DateTimeFormat("es-CL", {
          timeZone: city.timezone,
          weekday: "short",
          day: "2-digit",
          month: "short"
        }).format(now);

        document.getElementById(city.id + "-time").textContent = time;
        document.getElementById(city.id + "-date").textContent = date;

      });

    }


    // Actualizar inmediatamente
    updateClocks();

    // Actualizar cada segundo
    setInterval(updateClocks, 1000);

  </script>

</body>
</html>
